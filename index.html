<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מודל היסודות השיווקיים | טוהר אקנין</title>
<meta name="description" content="מסע אינטראקטיבי בחמישה יסודות לבניית שיווק יציב, עם ליווי אישי לאורך הדרך ודוח אישי בסוף.">
<meta property="og:title" content="מודל היסודות השיווקיים | טוהר אקנין">
<meta property="og:description" content="שיווק טוב הוא לא אוסף של טיפים. הוא מערכת. מסע אינטראקטיבי בחמישה יסודות, עם דוח אישי בסוף.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/logo.png">
<meta name="theme-color" content="#EDE2D3">
<link rel="icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   מודל היסודות השיווקיים — טוהר אקנין
   מסע אינטראקטיבי · RTL · Mobile-first
   הפלטה מודגשת-חום (טרהקוטה) מ-10.8.2026 לפי משוב טוהר.
   ============================================================ */
:root{
  /* טרהקוטה = צבע הפעולה. חום־דיו = צבע הטקסט. כל צמד נבדק מול תקן הניגודיות. */
  --warm:#A8522F; --warm-deep:#8E4622; --warm-light:#D89A72;
  --warm-soft:#F6E7DA; --warm-line:#E2C3AA;
  --accent:#6B5640; --accent-deep:#54422F; --accent-light:#C9AE94; --accent-soft:#F3EADC;
  --bronze:#977E62; --bronze-light:#C9AE94;
  --ink:#000000; --ink-soft:#333333; --ink-mute:#595959;
  --cream:#EDE2D3; --cream-deep:#E0D2BE; --card:#FAF5EC; --line:#D9CBB6;
  --radius:18px; --radius-sm:12px;
  --shadow-sm:0 1px 3px rgba(107,86,64,.07), 0 6px 18px rgba(107,86,64,.06);
  --shadow-md:0 2px 6px rgba(107,86,64,.09), 0 16px 44px rgba(107,86,64,.10);
  --shadow-lg:0 4px 12px rgba(142,70,34,.12), 0 28px 70px rgba(142,70,34,.15);
  --serif:'Rubik', -apple-system, 'Segoe UI', sans-serif;   /* כותרות — Bold */
  --sans:'Rubik', -apple-system, 'Segoe UI', sans-serif;    /* גוף */
  --maxw:680px;
  --navh:78px;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:var(--sans); font-size:17px; font-weight:400; line-height:1.8;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
/* height:auto חיוני — בלעדיו תכונת height="" של ה-HTML מותחת את התמונה */
img{ max-width:100%; height:auto; display:block; }
h1,h2,h3{ font-family:var(--serif); font-weight:700; line-height:1.3; margin:0; letter-spacing:-.015em; color:var(--ink); }
p{ margin:0 0 1.1em; } p:last-child{ margin-bottom:0; }
strong{ font-weight:600; }
button{ font-family:inherit; }

/* ══════════════ SHELL ══════════════ */
.app{ min-height:100dvh; display:flex; flex-direction:column; }

.hdr{
  position:sticky; top:0; z-index:40;
  background:rgba(237,226,211,.97);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hdr__rail{ height:4px; background:var(--cream-deep); }
.hdr__fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--warm-light),var(--warm)); transition:width .5s cubic-bezier(.2,.8,.25,1); }
.hdr__in{ max-width:var(--maxw); margin-inline:auto; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.hdr__where{ font-size:.86rem; color:var(--ink-soft); font-weight:400; min-width:0; }
.hdr__where b{ font-family:var(--serif); color:var(--warm-deep); font-weight:600; }
.hdr__count{ font-size:.82rem; color:var(--ink-mute); white-space:nowrap; direction:ltr; unicode-bidi:isolate; }

.stage{ flex:1; padding:34px 0 calc(var(--navh) + 34px); }
.wrap{ max-width:var(--maxw); margin-inline:auto; padding-inline:22px; }

.step{ display:none; }
.step.on{ display:block; animation:rise .5s cubic-bezier(.2,.8,.25,1) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .step.on{ animation:none; } }

.nav{
  position:fixed; bottom:0; inset-inline:0; z-index:45;
  background:rgba(237,226,211,.97);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom));
}
.nav__in{ max-width:var(--maxw); margin-inline:auto; display:flex; align-items:center; gap:9px; }
.nav__in .btn{ flex:none; }
.nav__next{ flex:1 !important; }

/* ══════════════ BUTTONS ══════════════ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-size:1rem; font-weight:500; padding:14px 26px; border-radius:99px;
  border:1px solid transparent; cursor:pointer; text-decoration:none; line-height:1;
  transition:all .25s cubic-bezier(.2,.7,.3,1); white-space:nowrap;
}
.btn--primary{ background:var(--warm); color:#fff; box-shadow:0 4px 16px rgba(168,82,47,.30); }
.btn--primary:hover{ background:var(--warm-deep); transform:translateY(-1px); }
.btn--ghost{ background:transparent; color:var(--warm-deep); border-color:var(--warm-line); }
.btn--ghost:hover{ background:var(--card); border-color:var(--warm-light); }
.btn--wa{ background:#25D366; color:#fff; }
.btn--wa:hover{ background:#1FB855; }
.btn--block{ width:100%; }
.btn:disabled{ opacity:.32; cursor:not-allowed; transform:none !important; }
.btn--icon{ padding:14px; width:50px; }
.btn--teach{ background:var(--warm-soft); color:var(--warm-deep); border-color:var(--warm-line); padding:11px 16px 11px 11px; font-weight:600; }
.btn--teach:hover{ background:#fff; }
.btn--teach .cmark{ width:26px; height:26px; }
@media (max-width:380px){ .btn--teach span{ display:none; } .btn--teach{ padding:11px; } }

/* ══════════════ WELCOME ══════════════ */
.welcome{ text-align:center; padding-top:4px; }
.welcome__logo{ width:172px; margin:0 auto 18px; }
.welcome__eyebrow{ font-size:.78rem; letter-spacing:.14em; color:var(--warm-deep); font-weight:600; margin-bottom:16px; }
.welcome h1{ font-size:clamp(1.95rem,7.2vw,2.7rem); line-height:1.22; margin-bottom:18px; }
.welcome h1 em{ font-style:normal; color:var(--ink); display:block; }
.rule{ width:52px; height:1px; background:var(--warm-light); margin:0 auto 24px; position:relative; }
.rule::before,.rule::after{ content:''; position:absolute; top:50%; width:5px; height:5px; border-radius:50%; background:var(--warm); transform:translateY(-50%); }
.rule::before{ inset-inline-start:-11px; } .rule::after{ inset-inline-end:-11px; }
.welcome__sub{ max-width:28ch; margin:0 auto 24px; color:var(--ink-soft); font-size:1.05rem; line-height:1.65; }
.welcome__portrait{ width:min(262px,66vw); margin:0 auto 22px; }
.welcome__portrait img{ width:100%; border-radius:20px; box-shadow:var(--shadow-lg); }
.welcome__meta{ font-size:.9rem; color:var(--ink-mute); margin-bottom:24px; }
.welcome__meta b{ font-family:var(--serif); color:var(--ink); font-size:1.02rem; font-weight:700; }
.facts{ display:flex; border-block:1px solid var(--line); padding:15px 0; }
.fact{ flex:1; text-align:center; padding-inline:5px; }
.fact + .fact{ border-inline-start:1px solid var(--line); }
.fact b{ display:block; font-family:var(--serif); font-size:1.3rem; color:var(--ink); font-weight:700; line-height:1.25; }
.fact span{ font-size:.79rem; color:var(--ink-mute); }
.welcome__note{ font-size:.86rem; color:var(--ink-mute); margin-top:18px; }

/* ══════════════ STEP CONTENT ══════════════ */
.crumb{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.crumb i{ font-style:normal; font-family:var(--serif); font-size:.88rem; font-weight:700; width:36px; height:36px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--warm); color:#fff; box-shadow:0 3px 10px rgba(168,82,47,.28); }
.crumb span{ font-size:.8rem; letter-spacing:.08em; color:var(--warm-deep); font-weight:600; }
.step h2{ font-size:clamp(1.6rem,5.6vw,2.2rem); margin-bottom:12px; }
.lede{ font-size:1.05rem; color:var(--ink); font-weight:500; margin-bottom:24px; line-height:1.6; }
.copy{ margin-bottom:22px; color:var(--ink-soft); }

.pull{ font-family:var(--serif); font-size:clamp(1.22rem,4.3vw,1.5rem); line-height:1.5; color:var(--ink); font-weight:700; padding:22px 0; margin:24px 0; border-block:2px solid var(--warm-line); text-align:center; }
.beats{ list-style:none; padding:0; margin:18px 0 24px; }
.beats li{ padding:10px 0; border-bottom:1px dashed var(--line); display:flex; gap:12px; align-items:flex-start; color:var(--ink-soft); }
.beats li:last-child{ border-bottom:0; }
.beats li::before{ content:''; width:7px; height:7px; border-radius:50%; flex:none; background:var(--warm-light); margin-top:.66em; }

.psych{ background:var(--warm-soft); border:1px solid var(--warm-line); border-radius:var(--radius); padding:24px 22px; margin:24px 0; }
.psych__tag{ display:flex; align-items:center; gap:8px; font-size:.78rem; font-weight:700; letter-spacing:.06em; color:var(--warm-deep); margin-bottom:13px; }
.psych__tag svg{ width:16px; height:16px; }
.psych p{ color:#3E2F23; font-size:1rem; }

.voice{ background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--warm); border-radius:var(--radius); padding:24px 22px; margin:0 0 22px; box-shadow:var(--shadow-sm); }
.voice__head{ display:flex; align-items:center; gap:12px; margin-bottom:15px; }
.voice__head img{ width:48px; height:48px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--warm-line); }
.voice__name{ font-family:var(--serif); font-size:1.04rem; font-weight:700; line-height:1.3; color:var(--ink); }
.voice__role{ font-size:.79rem; color:var(--ink-mute); }
.voice p{ color:var(--ink-soft); font-size:1rem; }
.said{ font-family:var(--serif); font-weight:600; color:var(--ink); font-size:1.04rem; padding-inline-start:14px; border-inline-start:3px solid var(--warm-light); margin:14px 0; display:block; line-height:1.6; }

.sumline{ margin-top:26px; padding:20px 22px; background:var(--ink); color:#FFFFFF; border-radius:var(--radius); font-family:var(--serif); font-weight:500; font-size:1.04rem; line-height:1.65; }
.sumline b{ color:var(--warm-light); font-weight:600; }

.work{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow-md); }
.work__title{ font-family:var(--serif); font-size:1.24rem; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:10px; }
.work__title svg{ width:18px; height:18px; color:var(--warm); flex:none; }
.work__hint{ font-size:.9rem; color:var(--ink-mute); margin-bottom:20px; }
.q{ margin-bottom:18px; }
.q label{ display:block; font-size:.97rem; color:var(--ink); margin-bottom:8px; line-height:1.55; }
.q label b{ color:var(--ink); font-weight:700; font-family:var(--serif); font-size:1rem; margin-inline-end:8px; }
.q textarea{
  width:100%; min-height:72px; resize:vertical;
  font-family:var(--sans); font-size:16px; font-weight:400; line-height:1.7;
  color:var(--ink); background:var(--cream); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:12px 14px;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.q textarea::placeholder{ color:#A79B8A; }
.q textarea:focus{ outline:none; border-color:var(--warm); background:#fff; box-shadow:0 0 0 3px rgba(168,82,47,.18); }
.q textarea.filled{ background:#fff; border-color:var(--warm-light); }
.q__print{ display:none; }

.score{ background:linear-gradient(180deg,var(--warm-soft),rgba(246,231,218,.45)); border:1px solid var(--warm-line); border-radius:var(--radius-sm); padding:20px; margin-top:22px; }
.score__q{ font-size:.98rem; color:#3E2F23; font-weight:500; margin-bottom:16px; line-height:1.5; }
.score__row{ display:flex; align-items:center; gap:16px; }
.score__val{ font-family:var(--serif); font-size:1.9rem; font-weight:700; color:var(--warm-deep); min-width:66px; text-align:center; line-height:1; flex:none; direction:ltr; unicode-bidi:isolate; }
.score__val small{ font-size:.82rem; color:var(--ink-mute); font-family:var(--sans); }
.score__hint{
  font-size:.86rem; color:var(--warm-deep); font-weight:500; text-align:center; margin-top:12px;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.score__hint::before{ content:'←'; animation:nudge 1.6s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(-5px);} }
.score.rated .score__hint{ display:none; }
.score:not(.rated) .score__val{ color:var(--ink-mute); }
.score:not(.rated) input[type=range]::-webkit-slider-thumb{ border-color:var(--warm-light); }
@media (prefers-reduced-motion:reduce){ .score__hint::before{ animation:none; } }
input[type=range]{ -webkit-appearance:none; appearance:none; flex:1; height:6px; background:transparent; cursor:pointer; margin:0; }
/* "to left" ולא 90deg — ב-RTL הידית נעה מימין לשמאל, אז המילוי חייב להתחיל מימין */
input[type=range]::-webkit-slider-runnable-track{ height:7px; border-radius:99px; background:linear-gradient(to left,var(--warm) var(--pct,50%), #E0D2BE var(--pct,50%)); }
input[type=range]::-moz-range-track{ height:7px; border-radius:99px; background:#E0D2BE; }
input[type=range]::-moz-range-progress{ height:7px; border-radius:99px; background:var(--warm); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; margin-top:-10px; background:#fff; border:3px solid var(--warm); box-shadow:0 2px 8px rgba(168,82,47,.35); }
input[type=range]::-moz-range-thumb{ width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--warm); box-shadow:0 2px 8px rgba(168,82,47,.35); }
.score__scale{ display:flex; justify-content:space-between; font-size:.8rem; color:var(--ink-mute); margin-top:9px; }

.pillars{ display:flex; flex-direction:column; gap:10px; margin-top:24px; }
.pillar{ display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:15px 17px; box-shadow:var(--shadow-sm); }
.pillar i{ font-style:normal; font-family:var(--serif); font-weight:700; width:32px; height:32px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:.85rem; background:var(--warm-soft); color:var(--warm-deep); }
.pillar b{ font-family:var(--serif); font-weight:700; font-size:1.05rem; color:var(--ink); }
.pillar span{ display:block; font-size:.87rem; color:var(--ink-mute); line-height:1.4; }

/* ---- אבחון קצר ---- */
.qc{ margin-bottom:26px; }
.qc__q{ font-family:var(--serif); font-size:1.1rem; font-weight:700; color:var(--ink); margin-bottom:12px; line-height:1.4; }
.qc__opts{ display:flex; flex-direction:column; gap:9px; }
.qc__opt{
  text-align:start; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:13px 16px; cursor:pointer;
  transition:all .22s cubic-bezier(.2,.7,.3,1); box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:2px; width:100%;
}
.qc__opt b{ font-family:var(--serif); font-weight:700; font-size:1.02rem; color:var(--ink); }
.qc__opt span{ font-size:.86rem; color:var(--ink-mute); }
.qc__opt:hover{ border-color:var(--warm-light); background:#fff; }
.qc__opt.on{
  background:var(--warm); border-color:var(--warm-deep);
  box-shadow:0 4px 16px rgba(168,82,47,.30);
}
.qc__opt.on b{ color:#fff; }
.qc__opt.on span{ color:rgba(255,255,255,.82); }
.qc__note{ font-size:.84rem; color:var(--ink-mute); text-align:center; margin-top:4px; }

/* ---- ההמלצה האישית ---- */
.reco{
  background:var(--card); border:1px solid var(--warm-line);
  border-radius:var(--radius); padding:26px 22px;
  box-shadow:var(--shadow-md);
}
.reco__head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
.reco__head img{ width:52px; height:52px; border-radius:50%; object-fit:cover; flex:none; border:2px solid var(--warm-line); }
.reco__name{ font-family:var(--serif); font-weight:700; font-size:1.1rem; line-height:1.3; color:var(--ink); }
.reco__role{ font-size:.79rem; color:var(--ink-mute); }
.reco p{ color:var(--ink-soft); font-size:1rem; margin-bottom:1em; }
.reco strong{ color:var(--warm-deep); font-weight:700; }
.reco__cta{ margin-top:18px; padding:16px 18px; background:var(--warm-soft); border-radius:var(--radius-sm); }
.reco__cta p{ margin:0; color:#3E2F23; font-size:.98rem; }

/* ══════════════ הדוח האישי ══════════════ */
.rep__id{ display:flex; align-items:center; gap:14px; margin-bottom:12px; }
.rep__logo{ width:56px; flex:none; }
.rep__for{ margin:2px 0 0; font-size:.92rem; color:var(--warm-deep); font-weight:600; }
.rep__for:empty{ display:none; }

.namefld{ margin:0 0 26px; }
.namefld label{ display:block; font-size:.9rem; color:var(--ink-mute); margin-bottom:7px; }
.namefld input{
  width:100%; font-family:var(--sans); font-size:16px; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px;
  transition:border-color .25s, box-shadow .25s;
}
.namefld input::placeholder{ color:#A79B8A; }
.namefld input:focus{ outline:none; border-color:var(--warm); box-shadow:0 0 0 3px rgba(168,82,47,.18); }

.rep{ margin-bottom:30px; }
.rep__h{
  font-family:var(--serif); font-size:1.3rem; font-weight:700; color:var(--ink);
  margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid var(--warm-line);
  display:flex; align-items:center; gap:9px;
}
.rep__h--good::before{ content:''; width:11px; height:11px; border-radius:50%; background:#5F7D4A; }
.rep__h--fix::before{ content:''; width:11px; height:11px; border-radius:50%; background:var(--warm); }
.rep__lede{ color:var(--ink-soft); font-size:.99rem; margin-bottom:16px; }
.rep__note{ font-size:.9rem; color:var(--ink-mute); margin-top:14px; line-height:1.65; }
.rep__method{
  margin-top:16px; font-size:.88rem; line-height:1.7; color:#4A3A2C;
  background:var(--warm-soft); border:1px solid var(--warm-line); border-radius:var(--radius-sm); padding:14px 16px;
}
.rep__method b{ display:block; font-family:var(--serif); font-weight:700; color:var(--warm-deep); margin-bottom:5px; }

/* כרטיס הציון */
.scorecard{
  background:linear-gradient(155deg,var(--warm),var(--warm-deep)); color:#fff;
  border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.scorecard__ring{ position:relative; width:128px; height:128px; flex:none; margin-inline:auto; }
.ring{ width:128px; height:128px; transform:rotate(-90deg); }
.ring__bg{ fill:none; stroke:rgba(255,255,255,.26); stroke-width:9; }
.ring__on{ fill:none; stroke:#fff; stroke-width:9; stroke-linecap:round; transition:stroke-dasharray .9s cubic-bezier(.2,.8,.25,1); }
.scorecard__num{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  direction:ltr; unicode-bidi:isolate;
}
.scorecard__num b{ display:block; font-family:var(--serif); font-size:2.5rem; font-weight:700; line-height:1; }
.scorecard__num small{ font-size:.7rem; opacity:.85; }
.scorecard__txt{ flex:1 1 15rem; min-width:0; }
.scorecard__tag{ font-size:.76rem; letter-spacing:.1em; opacity:.85; margin-bottom:6px; }
.scorecard__band{ font-family:var(--serif); font-weight:700; font-size:clamp(1.45rem,5.4vw,1.9rem); line-height:1.2; margin-bottom:11px; }
.scorecard p{ font-size:.99rem; line-height:1.7; opacity:.95; margin:0; }

/* מפת היסודות */
.chart{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px 20px; box-shadow:var(--shadow-md); }
.bar{ margin-bottom:20px; } .bar:last-child{ margin-bottom:0; }
.bar__top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:10px; }
.bar__name{ font-family:var(--serif); font-size:1.01rem; font-weight:600; color:var(--ink); }
.bar__score{ font-family:var(--serif); font-size:.96rem; color:var(--ink); font-weight:700; white-space:nowrap; direction:ltr; unicode-bidi:isolate; }
.bar__track{ height:10px; background:var(--cream-deep); border-radius:99px; overflow:hidden; }
.bar__fill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--warm-light),var(--warm)); transition:width .9s cubic-bezier(.2,.8,.25,1); }
.bar__sub{ font-size:.82rem; color:var(--ink-mute); margin-top:6px; }
.bar.weakest{ background:var(--warm-soft); border:1px solid var(--warm-line); border-radius:14px; padding:14px 15px; margin-inline:-15px; }
.bar.weakest .bar__name{ color:var(--warm-deep); font-weight:700; }
.bar.weakest .bar__name::after{ content:'להתחיל כאן'; font-family:var(--sans); font-size:.66rem; font-weight:700; color:#fff; background:var(--warm); padding:3px 9px; border-radius:99px; margin-inline-start:9px; display:inline-block; vertical-align:middle; }
.bar.weakest .bar__fill{ background:linear-gradient(90deg,var(--warm),var(--warm-deep)); }
.bar.weakest .bar__track{ background:#fff; }

/* פריט חוזקה / פער */
.item{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 19px; box-shadow:var(--shadow-sm); margin-bottom:12px; }
.item:last-child{ margin-bottom:0; }
.item__head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:9px; }
.item__head b{ font-family:var(--serif); font-size:1.1rem; font-weight:700; color:var(--ink); }
.item__head span{ font-family:var(--serif); font-size:.88rem; font-weight:700; color:var(--ink-mute); white-space:nowrap; direction:ltr; unicode-bidi:isolate; }
.item p{ color:var(--ink-soft); font-size:.99rem; margin-bottom:0; }
.item--good{ border-inline-start:4px solid #5F7D4A; }
.item--fix{ border-inline-start:4px solid var(--warm); }
.item__rx{ margin-top:12px !important; }
.item__rx b{ color:var(--warm-deep); font-weight:700; }
.item__acts{ margin-top:15px; padding-top:14px; border-top:1px dashed var(--line); }
.item__acts-t{ font-size:.79rem; letter-spacing:.06em; font-weight:700; color:var(--warm-deep); margin-bottom:9px; }
.item__acts ul{ list-style:none; padding:0; margin:0; }
.item__acts li{ position:relative; padding:6px 0 6px 0; padding-inline-start:26px; color:var(--ink-soft); font-size:.96rem; line-height:1.6; }
.item__acts li::before{
  content:''; position:absolute; inset-inline-start:0; top:.72em;
  width:14px; height:14px; border:1.5px solid var(--warm-light); border-radius:4px;
}

/* ציטוט מהתשובות שלה */
.quote{ margin-top:15px; padding-top:14px; border-top:1px dashed var(--line); }
.quote__q{ font-size:.79rem; letter-spacing:.06em; font-weight:700; color:#4C6B39; margin-bottom:8px; }
.quote blockquote{
  margin:0; padding-inline-start:14px; border-inline-start:3px solid var(--warm-light);
  font-family:var(--serif); font-size:1rem; font-weight:500; line-height:1.65; color:var(--ink);
}
.quote cite{ display:block; font-style:normal; font-size:.83rem; color:var(--ink-mute); margin-top:8px; }

/* שאלות ריקות */
.blanks{ list-style:none; padding:0; margin:0; }
.blanks li{ padding:11px 0; border-bottom:1px dashed var(--line); color:var(--ink-soft); font-size:.97rem; line-height:1.6; }
.blanks li:last-child{ border-bottom:0; }
.blanks li span{
  display:inline-block; font-size:.72rem; font-weight:700; color:var(--warm-deep);
  background:var(--warm-soft); border-radius:99px; padding:3px 10px; margin-inline-end:9px;
}

/* תוכנית שבועיים */
.plan{ display:flex; flex-direction:column; gap:12px; }
.plan__wk{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:19px; box-shadow:var(--shadow-sm); }
.plan__t{ font-family:var(--serif); font-weight:700; font-size:1.06rem; color:var(--ink); margin-bottom:11px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.plan__t span{ font-family:var(--sans); font-size:.72rem; font-weight:700; color:#fff; background:var(--warm); border-radius:99px; padding:3px 10px; }
.plan__wk ul{ list-style:none; padding:0; margin:0; }
.plan__wk li{ position:relative; padding:7px 0; padding-inline-start:26px; color:var(--ink-soft); font-size:.96rem; line-height:1.6; }
.plan__wk li::before{
  content:''; position:absolute; inset-inline-start:0; top:.78em;
  width:14px; height:14px; border:1.5px solid var(--warm-light); border-radius:4px;
}
.rep--end p{ color:var(--ink-soft); }

.verdict{ background:linear-gradient(160deg,var(--warm),var(--warm-deep)); color:#fff; border-radius:var(--radius); padding:30px 24px; box-shadow:var(--shadow-lg); text-align:center; }
.verdict__tag{ font-size:.76rem; letter-spacing:.1em; opacity:.85; margin-bottom:12px; }
.verdict__name{ font-family:var(--serif); font-weight:700; font-size:clamp(1.6rem,5.6vw,2.15rem); margin-bottom:14px; line-height:1.25; }
.verdict__body{ font-size:1.01rem; line-height:1.75; opacity:.95; font-weight:400; max-width:38ch; margin:0 auto; }
.verdict.empty{ background:var(--cream-deep); color:var(--ink-soft); box-shadow:var(--shadow-sm); }
.verdict.empty .verdict__name{ color:var(--ink); font-size:1.3rem; }
.verdict.empty .verdict__tag{ color:var(--warm-deep); opacity:1; }
.actions{ display:flex; flex-direction:column; gap:10px; }
.saved{ text-align:center; font-size:.82rem; color:var(--ink-mute); margin-top:18px; display:flex; align-items:center; justify-content:center; gap:7px; }
.saved svg{ width:14px; height:14px; color:var(--warm); }

@media (min-width:560px){
  .scorecard{ flex-wrap:nowrap; }
  .scorecard__ring{ margin-inline:0; }
}

/* ---- לכידת ליד ---- */
.lead{ background:var(--card); border:1px solid var(--warm-line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow-md); }
.lead__chip{
  display:inline-block; font-size:.86rem; color:#3E2F23;
  background:var(--warm-soft); border-radius:99px; padding:8px 15px; margin-bottom:20px;
}
.lead__chip b{ font-family:var(--serif); font-weight:700; color:var(--ink); }
.fld{ margin-bottom:16px; }
.fld label{ display:block; font-size:.95rem; color:var(--ink); margin-bottom:7px; }
.fld input{
  width:100%; font-family:var(--sans); font-size:16px; font-weight:400;
  color:var(--ink); background:var(--cream); border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:14px 15px;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.fld input::placeholder{ color:#A79B8A; }
.fld input:focus{ outline:none; border-color:var(--warm); background:#fff; box-shadow:0 0 0 3px rgba(168,82,47,.18); }
.fld__err{ font-size:.84rem; color:#A0522D; margin-top:6px; min-height:1.1em; }
.lead__note{ font-size:.86rem; color:var(--ink-mute); text-align:center; margin:12px 0 0; }
.lead__or{ position:relative; text-align:center; margin:20px 0 16px; }
.lead__or::before{ content:''; position:absolute; inset-inline:0; top:50%; height:1px; background:var(--line); }
.lead__or span{ position:relative; background:var(--card); padding:0 14px; font-size:.82rem; color:var(--ink-mute); }
.lead__done{ text-align:center; padding:8px 0; }
.lead__tick{
  width:60px; height:60px; margin:0 auto 16px; border-radius:50%;
  background:var(--warm); color:#fff; display:grid; place-items:center;
  box-shadow:0 6px 20px rgba(168,82,47,.34);
}
.lead__tick svg{ width:28px; height:28px; }
.lead__tick--wait{ background:var(--warm-deep); }
.btn--teach.is-off{ opacity:.6; }
.lead__done h3{ font-size:1.35rem; margin-bottom:10px; color:var(--ink); }
.lead__done p{ color:var(--ink-soft); font-size:1rem; max-width:32ch; margin-inline:auto; }

.closing{ text-align:center; }
.closing__logo{ width:150px; margin:30px auto 6px; }

/* ══════════════ המלווה ══════════════ */
/* סימן משלה — מכוון, לא הפנים של טוהר. הליווי נשען על השיטה שלה,
   אבל אסור שייראה כאילו טוהר עצמה מקלידה בצד השני. */
.cmark{
  width:30px; height:30px; flex:none; border-radius:50%;
  display:grid; place-items:center;
  background:var(--warm-soft); border:1.5px solid var(--warm-light); color:var(--warm);
}
.cmark svg{ width:60%; height:60%; }
.cmark--lg{ width:44px; height:44px; }

.tsheet{ position:fixed; inset:0; z-index:70; display:none; background:rgba(51,42,33,.42); backdrop-filter:blur(3px); }
.tsheet.on{ display:block; }
.tsheet__panel{
  position:absolute; inset-inline:0; bottom:0; height:86dvh;
  background:var(--cream); border-radius:22px 22px 0 0;
  display:flex; flex-direction:column; box-shadow:0 -10px 50px rgba(51,42,33,.28);
  animation:slideUp .34s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:none; } }
@media (min-width:900px){
  .tsheet__panel{ inset-block:0; inset-inline-end:auto; inset-inline-start:0; width:440px; height:100dvh;
    border-radius:0 22px 22px 0; animation:slideIn .34s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes slideIn{ from{ transform:translateX(100%);} to{ transform:none; } }
}
.tsheet__head{ display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); flex:none; }
.tsheet__name{ font-family:var(--serif); font-weight:700; font-size:1.06rem; line-height:1.25; color:var(--ink); }
.tsheet__role{ font-size:.79rem; color:var(--ink-mute); }
.tsheet__x{ margin-inline-start:auto; background:none; border:0; cursor:pointer; color:var(--ink-mute); width:44px; height:44px; border-radius:50%; display:grid; place-items:center; }
.tsheet__x:hover{ background:var(--cream-deep); }

.tlog{ flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:13px; }
.msg{ max-width:88%; font-size:.97rem; line-height:1.7; }
.msg--t{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-radius:16px 16px 16px 4px; padding:13px 16px; color:var(--ink-soft); }
.msg--u{ align-self:flex-end; background:var(--warm); color:#fff; border-radius:16px 16px 4px 16px; padding:13px 16px; font-weight:400; }
.msg p{ margin:0 0 .7em; } .msg p:last-child{ margin:0; }
.msg--t strong{ color:var(--warm-deep); font-weight:700; }
.dots3{ display:flex; gap:5px; padding:4px 2px; }
.dots3 i{ width:7px; height:7px; border-radius:50%; background:var(--warm-light); animation:blink 1.3s infinite; }
.dots3 i:nth-child(2){ animation-delay:.2s; } .dots3 i:nth-child(3){ animation-delay:.4s; }
@keyframes blink{ 0%,60%,100%{ opacity:.3; } 30%{ opacity:1; } }

.tsug{ display:flex; gap:8px; padding:0 20px 12px; flex-wrap:wrap; flex:none; }
.tsug button{ min-height:44px; font-size:.87rem; color:var(--warm-deep); background:var(--warm-soft); border:1px solid var(--warm-line); border-radius:99px; padding:8px 14px; cursor:pointer; transition:background .2s; }
.tsug button:hover{ background:#fff; }

.tform{ display:flex; gap:9px; padding:12px 20px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); flex:none; align-items:flex-end; }
.tform textarea{ flex:1; min-height:46px; max-height:120px; resize:none; font-family:var(--sans); font-size:16px; font-weight:400; line-height:1.5; border:1px solid var(--line); border-radius:22px; padding:12px 16px; background:#fff; color:var(--ink); }
.tform textarea:focus{ outline:none; border-color:var(--warm); box-shadow:0 0 0 3px rgba(168,82,47,.18); }
.tform button{ width:46px; height:46px; flex:none; border-radius:50%; border:0; background:var(--warm); color:#fff; cursor:pointer; display:grid; place-items:center; }
.tform button:disabled{ opacity:.4; cursor:not-allowed; }
.tnote{ font-size:.82rem; color:var(--ink-mute); text-align:center; padding:0 20px 10px; }

.toast{
  position:fixed; bottom:calc(var(--navh) + 16px); inset-inline:0; margin-inline:auto;
  width:max-content; max-width:86vw; z-index:80;
  background:var(--ink); color:#fff; font-size:.89rem; padding:11px 20px; border-radius:99px;
  box-shadow:var(--shadow-lg); opacity:0; transform:translateY(12px); pointer-events:none;
  transition:opacity .3s, transform .3s;
}
.toast.on{ opacity:1; transform:none; }

/* ══════════════ PRINT ══════════════ */
@media print{
  @page{ margin:14mm 12mm; }
  body{ background:#fff; font-size:11pt; }
  .hdr,.nav,.tsheet,.toast,.actions,.saved,.btn,.tsug,.welcome__note,
  .step[data-type="contact"], .score__hint, .lead, .qc__note, [data-noprint]{ display:none !important; }

  /* ── מצב "הדוח בלבד": מסמך אחד נקי, לא כל המסע ── */
  body.print-report .step{ display:none !important; }
  body.print-report .step[data-type="diagnostic"]{ display:block !important; border-bottom:0 !important; padding:0 !important; }
  body.print-report .stage{ padding:0 !important; }

  .rep{ break-inside:avoid; page-break-inside:avoid; margin-bottom:18px; }
  .rep__h{ break-after:avoid; page-break-after:avoid; }
  .scorecard{
    background:#A8522F !important; color:#fff !important; box-shadow:none;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .ring__bg{ stroke:rgba(255,255,255,.3) !important; }
  .ring__on{ stroke:#fff !important; }
  .rep__method, .item__acts, .plan__wk, .item, .chart{ box-shadow:none; }
  .rep__method{ background:#F6E7DA !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .bar.weakest{ background:#F6E7DA !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .bar.weakest .bar__name::after, .plan__t span, .blanks li span{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .item, .plan__wk, .chart{ break-inside:avoid; page-break-inside:avoid; }
  /* הסליידר מודפס כמספר, לא כפקד */
  .score__row input[type=range], .score__scale{ display:none !important; }
  .score{ background:#F0E8DC !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .score__val{ font-size:1.4rem; text-align:start; }
  /* באבחון הקצר מדפיסים רק את מה שהיא בחרה */
  .qc__opt{ display:none !important; box-shadow:none !important; }
  .qc__opt.on{ display:flex !important; background:#F0E8DC !important; border-color:#C9AE94 !important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .qc__opt.on b{ color:#332A21 !important; }
  .qc__opt.on span{ color:#6B5E50 !important; }
  .stage{ padding:0; }
  .step{ display:block !important; animation:none !important; border-bottom:1px solid #ddd; padding:12px 0; }
  h2,h3,.crumb,.work__title{ break-after:avoid; page-break-after:avoid; }
  .q{ break-inside:avoid; page-break-inside:avoid; margin-bottom:12px; }
  .work,.psych,.voice,.chart{ box-shadow:none; break-inside:avoid; }
  .pull{ margin:16px 0; padding:16px 0; }
  .beats li{ padding:5px 0; }
  /* התיבה עצמה לא מודפסת יפה — מדפיסים במקומה את הטקסט שהיא כתבה */
  .q textarea{ display:none !important; }
  .q__print{
    display:block !important; font-size:10.5pt; line-height:1.7; color:#332A21;
    border-bottom:1px solid #ddd; padding:2px 0 6px; min-height:1.7em;
  }
  .q__print.empty{ min-height:3.4em; border-bottom:1px solid #ccc;
    background:repeating-linear-gradient(transparent, transparent 1.65em, #e6ded2 1.65em, #e6ded2 calc(1.65em + 1px));
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sumline{ background:#F0E8DC; color:#332A21; }
  .sumline b{ color:#6B5640; }
  .verdict{ background:#F0E8DC !important; color:#332A21 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .verdict__name,.verdict__body{ color:#332A21 !important; }
  .bar__fill{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .welcome__portrait{ width:150px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="hdr__rail"><div class="hdr__fill" id="fill"></div></div>
    <div class="hdr__in">
      <div class="hdr__where" id="where"></div>
      <div class="hdr__count" id="count"></div>
    </div>
  </header>

  <main class="stage"><div class="wrap" id="stage"></div></main>

  <nav class="nav">
    <div class="nav__in">
      <button class="btn btn--ghost btn--icon" id="back" aria-label="חזרה לשלב הקודם">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="btn btn--teach" id="teach">
        <span class="cmark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.6v2.4M12 19v2.4M4.3 4.3 6 6M18 18l1.7 1.7M2.6 12H5M19 12h2.4M4.3 19.7 6 18M18 6l1.7-1.7"/></svg>
        </span>
        <span id="teachLabel">לחשוב יחד</span>
      </button>
      <button class="btn btn--primary nav__next" id="next">הבא</button>
    </div>
  </nav>
</div>

<div class="tsheet" id="tsheet">
  <div class="tsheet__panel" role="dialog" aria-modal="true" aria-label="המלווה">
    <div class="tsheet__head">
      <span class="cmark cmark--lg" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.6v2.4M12 19v2.4M4.3 4.3 6 6M18 18l1.7 1.7M2.6 12H5M19 12h2.4M4.3 19.7 6 18M18 6l1.7-1.7"/></svg>
      </span>
      <div>
        <div class="tsheet__name" id="tName">המלווה</div>
        <div class="tsheet__role" id="tRole">לא נותנת תשובות, עוזרת לך להגיע אליהן</div>
      </div>
      <button class="tsheet__x" id="tclose" aria-label="סגירה">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="tlog" id="tlog"></div>
    <div class="tsug" id="tsug"></div>
    <form class="tform" id="tform">
      <textarea id="tinput" rows="1" placeholder="על מה נחשוב יחד?" aria-label="הודעה למלווה"></textarea>
      <button type="submit" id="tsend" aria-label="שליחה">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
    <div class="tnote" id="tnote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
